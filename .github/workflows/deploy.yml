name: Deploy CheapDataHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: artifacts/cheapdata/package.ci.json

      - name: Use standalone CI package.json
        working-directory: artifacts/cheapdata
        run: cp package.ci.json package.json

      - name: Install dependencies
        working-directory: artifacts/cheapdata
        run: npm install

      - name: Build for GitHub Pages
        working-directory: artifacts/cheapdata
        run: npm run build:gh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "artifacts/cheapdata/dist-gh"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI v2.107.0
        run: |
          curl -sSL https://github.com/supabase/cli/releases/download/v2.107.0/supabase_2.107.0_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar -xf /tmp/supabase.tar.gz -C /tmp supabase
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in verify-cable verify-education send-otp buy-data buy-cable buy-education buy-airtime buy-electricity sync-plans auto-sync-plans verify-meter; do
            if [ -d "supabase/functions/$fn" ]; then
              echo "Deploying $fn..."
              supabase functions deploy $fn --project-ref vumuvcghlumvenmnakyo --no-verify-jwt || echo "WARNING: $fn deploy failed, continuing..."
            fi
          done
          echo "All function deployments done"
