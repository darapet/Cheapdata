name: Run DB Migration (Profile Trigger)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          curl -sSL https://github.com/supabase/cli/releases/download/v2.107.0/supabase_2.107.0_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar -xf /tmp/supabase.tar.gz -C /tmp supabase
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Run profile trigger + backfill SQL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db execute \
            --project-ref vumuvcghlumvenmnakyo \
            --file profile-trigger-migration.sql
