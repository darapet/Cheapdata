kind = "web"
previewPath = "/"
title = "CheapDataHub"
version = "1.0.0"
id = "artifacts/cheapdata"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23255

[services.development]
run = "pnpm --filter @workspace/cheapdata run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cheapdata", "run", "build" ]
publicDir = "artifacts/cheapdata/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23255"
BASE_PATH = "/"
